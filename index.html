<!DOCTYPE html>

<html lang="pt-br">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog</title>
    <style>
     
      header{
        background-color: #26115F;
        color: #C898FD;
        text-align: center;
        max-width: 800px;
        margin: 0 auto;
        padding: 16px;
      }
      main{
        background-color: #FF69B4;
        color: #87CEFA;
        max-width: 800px;
        margin: 0 auto;
        padding: 16px;
        display: flex;
        gap: 20px
      }
      img {
        width: 160px;
        height: 160px;
      }
      .artigo-autor {
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>BTS</h1>
      </p1>Mariana Moreira</p1>
    </header>
     
    <main>
      <img src="Gemini_Generated_Image_6xt6mx6xt6mx6xt6.png" alt="imagem do grupo">
      <div>
        <h2>Meu primeiro post</h2>
        <p class="artigo-autor"></p>
        <p> <p>Boas vindas ao meu novo blog! Aqui vou compartilhar curiosidades sobre um grupo sul coreano.</p>
        <button>👍<span>0</span></button>
         <button>👎<span>0</span></button>
       
      </div>
    </main>
  </body>
  <script>
   
    const botoes = document.querySelectorAll("button");
   
    botoes.forEach(function(botao) {
      botao.addEventListener("click", botaoClicado);
      function botaoClicado() {
        console.log("fui clicado");
        let texto = botao.querySelector("span");
        texto.textContent++;
      }
})
  </script>
</html>
